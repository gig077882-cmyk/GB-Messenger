server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Immutable bundled assets
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # PWA shell needs fresh HTML
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
