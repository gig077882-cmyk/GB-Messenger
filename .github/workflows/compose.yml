name: Docker Compose validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create validation environment
        shell: bash
        run: |
          cat > .env.validation <<'EOF'
          NODE_ENV=production
          DOMAIN=localhost
          ACME_EMAIL=validation@example.invalid
          HOST=0.0.0.0
          PORT=3000
          JWT_SECRET=validation-only-not-a-production-secret-123456789
          ACCESS_TTL=15m
          REFRESH_TTL_DAYS=30
          COOKIE_SECURE=true
          MAX_USERS=60
          MAX_FILE_BYTES=5368709120
          UPLOAD_CHUNK_BYTES=8388608
          FILE_RETENTION_HOURS=72
          MAX_STORAGE_BYTES=322122547200
          MIN_FREE_BYTES=53687091200
          TURN_REALM=localhost
          TURN_EXTERNAL_IP=127.0.0.1
          TURN_SHARED_SECRET=validation-only-turn-secret-not-for-production
          BACKUP_INTERVAL_SECONDS=86400
          EOF
      - run: docker compose --env-file .env.validation config -q
