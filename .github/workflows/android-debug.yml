name: Android debug APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/android/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - name: TypeScript check
        run: npm run typecheck --if-present
      - name: Assemble debug APK with declared Gradle distribution
        working-directory: apps/android/android
        shell: bash
        run: |
          distribution_url=$(sed -n 's/^distributionUrl=//p' gradle/wrapper/gradle-wrapper.properties | sed 's#\\:#:#g')
          gradle_version=$(basename "$distribution_url" | sed -E 's/^gradle-([0-9.]+)-(bin|all)\.zip$/\1/')
          curl --fail --location --retry 3 --output gradle.zip "$distribution_url"
          unzip -q gradle.zip
          "$(pwd)/gradle-${gradle_version}/bin/gradle" --no-daemon assembleDebug
          rm -rf gradle.zip "gradle-${gradle_version}"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: krug-android-debug-apk
          path: apps/android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
