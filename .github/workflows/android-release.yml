name: Publish signed Android release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android/android
    env:
      ANDROID_KEYSTORE_FILE: app/krug-release.jks
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - uses: android-actions/setup-android@v3
      - name: Restore production keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/krug-release.jks
          chmod 600 app/krug-release.jks
      - name: Build signed release APK
        run: gradle clean assembleRelease --no-daemon
      - name: Verify signature and metadata
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          apksigner verify --verbose --print-certs "$APK"
          aapt dump badging "$APK" | grep '^package:'
      - name: Prepare release files
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          cp "$APK" ../../../download-site/GB-Messenger-0.1.0-release.apk
          cd ../../../download-site
          sha256sum GB-Messenger-0.1.0-release.apk > GB-Messenger-0.1.0-release.apk.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            download-site/GB-Messenger-0.1.0-release.apk
            download-site/GB-Messenger-0.1.0-release.apk.sha256